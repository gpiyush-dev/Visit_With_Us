name: Tourism Purchase Prediction MLOps Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "tourism_project/deployment/model.joblib"
      - "reports/metrics.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas scikit-learn
      - name: Validate and register dataset
        run: python tourism_project/model_building/data_register.py

  prepare-data:
    runs-on: ubuntu-latest
    needs: register-dataset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas scikit-learn
      - name: Prepare train and test splits
        run: python tourism_project/model_building/prep.py
      - name: Upload train/test artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-data-splits
          path: artifacts/
          retention-days: 7

  train-evaluate-and-register:
    runs-on: ubuntu-latest
    needs: prepare-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Download train/test artifact
        uses: actions/download-artifact@v4
        with:
          name: tourism-data-splits
          path: artifacts/
      - name: Train, tune, evaluate, and track model
        run: python tourism_project/model_building/train.py
      - name: Commit model and evaluation metrics to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/model.joblib reports/metrics.json
          if git diff --cached --quiet; then
            echo "No model or metrics changes to commit."
          else
            git commit -m "chore: update trained tourism model [skip ci]"
            git push origin HEAD:main
          fi
